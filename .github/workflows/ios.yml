name: Build iPhone simulator app

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'public/**'
      - 'ios/**'
      - 'index.html'
      - 'package*.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - 'capacitor.config.ts'
      - '.github/workflows/ios.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Select Xcode 26.3
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build unsigned simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package simulator app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/Build/Products/Debug-iphonesimulator/App.app TailorStitch-simulator.zip
      - name: Stitch example on iPhone simulator
        run: |
          device_id=$(xcrun simctl create TailorStitchSmoke com.apple.CoreSimulator.SimDeviceType.iPhone-17)
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl install "$device_id" build/ios/Build/Products/Debug-iphonesimulator/App.app
          SIMCTL_CHILD_TAILORSTITCH_SMOKE_TEST=1 xcrun simctl launch "$device_id" com.tailorstitch.app
          app_data=$(xcrun simctl get_app_container "$device_id" com.tailorstitch.app data)
          report="$app_data/Documents/tailorstitch-smoke.json"
          for attempt in $(seq 1 60); do
            if [ -f "$report" ]; then break; fi
            sleep 2
          done
          xcrun simctl io "$device_id" screenshot TailorStitch-iPhone.png
          cp "$report" TailorStitch-native-smoke.json
          xcrun simctl shutdown "$device_id"
          node -e 'const fs = require("fs"); const result = JSON.parse(fs.readFileSync("TailorStitch-native-smoke.json", "utf8")); console.log(result); if (!result.success) process.exit(1);'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TailorStitch-iOS-simulator
          path: |
            TailorStitch-simulator.zip
            TailorStitch-iPhone.png
            TailorStitch-native-smoke.json
          if-no-files-found: error
          retention-days: 14
